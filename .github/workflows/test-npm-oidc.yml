name: Test GitHub OIDC

on:
  push:
    branches:
      - test/npm-oidc

jobs:
  check-oidc:
    runs-on: ubuntu-latest
    environment: CUBE_NPM_TOKEN
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Request an OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            if (!token) {
              core.setFailed("GitHub did not issue an OIDC token.");
              return;
            }
            core.info("GitHub issued an OIDC token; token value was not printed.");
